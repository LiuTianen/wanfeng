# 晚风 · Nginx 站点配置
# 部署到 /etc/nginx/sites-available/wanfeng 并在 sites-enabled 里软链
# 注意：把域名和 IP 换成你自己的；证书用 certbot 申请

# ── HTTP → HTTPS（保留 ACME 验证路径）──
server {
    listen 80;
    listen [::]:80;
    server_name ivywxx.cn 120.77.9.218;

    location /.well-known/acme-challenge/ {
        root /var/www/wanfeng;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 登录/验 Key 限流：单 IP 每分钟 20 次，突发放行 10 个
limit_req_zone $binary_remote_addr zone=wanfeng_auth:10m rate=20r/m;

server {
    # nginx >= 1.25.1 用 http2 on；更老的版本改成 listen 443 ssl http2;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ivywxx.cn 120.77.9.218;

    server_tokens off;
    charset utf-8;

    # ── SSL ──
    ssl_certificate     /etc/letsencrypt/live/ivywxx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivywxx.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全响应头（location 里再写 add_header 会覆盖这一组，需要时请在 location 内补齐）──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 页面里没有内联脚本（事件都走 addEventListener），因此 script-src 可以只允许同源
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;

    # 上传大小限制（与服务端 MAX_UPLOAD_SIZE 保持一致）
    client_max_body_size 50M;

    root /var/www/wanfeng;
    index index.html;

    # ── 上传的图片 ──
    location ^~ /uploads/originals/ {
        # RAW/原图归档目录不对公网开放
        deny all;
        return 404;
    }

    location /uploads/ {
        alias /var/www/wanfeng/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # 上传目录只应该是图片，禁掉脚本执行类 MIME 嗅探
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        try_files $uri =404;
    }

    # 历史遗留的 SVG 一律当附件下载，避免被当成页面打开执行脚本
    location ~* ^/uploads/.*\.svg$ {
        # 注意：regex location 里不能用 alias，必须用 root + try_files
        root /var/www/wanfeng;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── API 反向代理 ──
    location = /api/auth/verify {
        limit_req zone=wanfeng_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 注意：不要手动 proxy_set_header Content-Type，会破坏 multipart 的 boundary
    }

    # ── Service Worker / manifest 不缓存 ──
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # expires 不会覆盖上面 add_header 的继承，HTML 本身不入长缓存
        expires -1;
    }

    # ── 潮汐 (Tide) ── 同一台机器上的另一个应用，不需要可整段删除
    location ^~ /tide/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /tide/index.html;
    }

    location = /tide/sw.js {
        root /var/www;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/tide/";
    }

    location = /tide/manifest.json {
        root /var/www;
        add_header Cache-Control "no-cache";
    }

    location ^~ /tide/api/ {
        proxy_pass http://127.0.0.1:5001/tide/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;
}

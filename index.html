<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="晚风 · 极简图文日记，支持分组标签、日历翻阅与多用户共享。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="晚风">
  <title>晚风 · 图文日记</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a1a1a'/><text x='50' y='68' text-anchor='middle' font-size='56' font-family='serif' fill='%23c9a96e'>风</text></svg>">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=17">
</head>
<body>

<header>
  <h1>晚 风</h1>
  <span id="status-dot" class="status-dot local" title="本地模式"></span>
  <span class="count" id="count">0 条</span>
  <div class="header-btns" id="header-btns">
    <button id="btn-search" class="header-icon-btn" type="button" title="搜索" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><line x1="16" y1="16" x2="22" y2="22"/></svg></button>
    <button id="btn-conn" class="header-icon-btn" type="button" title="连接服务器" aria-label="连接服务器"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.5 1.5"/><path d="M14 10a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.5-1.5"/></svg></button>
    <button id="btn-cal" class="header-icon-btn" type="button" title="日历视图" aria-label="日历视图"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></button>
    <button id="btn-settings" class="header-icon-btn" type="button" title="设置" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button id="btn-add" class="header-icon-btn" type="button" title="新建笔记" aria-label="新建笔记"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  </div>
</header>

<div class="search-wrap"><input type="text" id="search" placeholder="翻一翻旧时光…" autocomplete="off"></div>
<div id="discover-view" style="display:none;flex:1;min-height:0;overflow-y:auto;flex-direction:column;gap:14px">
  <div id="discover-list" style="display:flex;flex-direction:column;gap:16px"></div>
  <div id="discover-footer" style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px"></div>
</div>
<div class="group-bar" id="group-bar"></div>
<div id="list"></div>
<div id="calendar-view">
  <div class="cal-header"></div>
  <div class="cal-grid cal-day-labels"></div>
  <div class="cal-grid cal-days"></div>
  <div class="cal-notes-title"></div>
  <div class="cal-notes-list"></div>
</div>

<nav class="bottom-nav" id="bottom-nav">
  <div class="nav-tabs-inner">
    <button class="nav-tab active" data-view="my" type="button">晚 风</button>
    <button class="nav-tab" data-view="discover" type="button">拾 光</button>
  </div>
</nav>

<script src="js/utils.js?v=17"></script>
<script src="js/api.js?v=17"></script>
<script src="js/state.js?v=17"></script>
<script src="js/sync.js?v=17"></script>
<script src="js/notes.js?v=17"></script>
<script src="js/calendar.js?v=17"></script>
<script src="js/discover.js?v=17"></script>
<script src="js/editor.js?v=17"></script>
<script src="js/settings.js?v=17"></script>
<script src="js/app.js?v=17"></script>

</body>
</html>

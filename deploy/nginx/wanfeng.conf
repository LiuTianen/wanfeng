# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name ivywxx.cn 120.77.9.218;

    # Let's Encrypt ACME 验证
    location /.well-known/acme-challenge/ {
        root /var/www/wanfeng;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name ivywxx.cn 120.77.9.218;

    # SSL 证书
    ssl_certificate     /etc/letsencrypt/live/ivywxx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivywxx.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传大小限制
    client_max_body_size 50M;

    root /var/www/wanfeng;
    index index.html;

    # 图片静态文件
    location /uploads/ {
        alias /var/www/wanfeng/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到 Flask
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_set_header Content-Type $content_type;
    }

    # Service Worker
    location /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # manifest.json
    location /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 潮汐 (Tide) ──
    # PWA 静态文件
    location /tide/ {
        alias /var/www/tide/;
        try_files $uri $uri/ /tide/index.html;
        index index.html;
    }

    # 潮汐 Service Worker
    location /tide/sw.js {
        alias /var/www/tide/sw.js;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/tide/";
    }

    # 潮汐 manifest.json
    location /tide/manifest.json {
        alias /var/www/tide/manifest.json;
        add_header Cache-Control "no-cache";
    }

    # 潮汐 API 反向代理
    location /tide/api/ {
        proxy_pass http://127.0.0.1:5001/tide/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
